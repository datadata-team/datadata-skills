interface:
  display_name: "Datadata API"
  short_description: "Datadata REST API reference — endpoint docs and urllib.request examples for script generation and API integration"
  default_prompt: |
    Use the datadata-api skill for Datadata REST API reference and script generation. Primary use case: generating standalone Python scripts (crawlers, ETL, batch processing). But the API docs are general-purpose — reference them whenever the user asks about Datadata API endpoints.

    For interactive operations (chat-based queries, data exploration, Data Spaces management, scheduled tasks), use datadata-mcp instead.

    ## Script generation

    All scripts must use only Python standard library (urllib.request, json, os). Never use requests, pandas, or other third-party libraries. Use the _request() template from SKILL.md.

    Before writing SQL in generated scripts, document the datasource schema requirements. Use DuckDB SQL by default; switch to ClickHouse SQL only for ClickHouse datasources. Bind datasources via the `datasources` array in the execute-adhoc payload.

    Queries are read-only via execute-adhoc. Never generate INSERT/UPDATE/DELETE/DDL in SQL — use Data Spaces endpoints (create-table, insert-rows, drop-table) for writes.

    For ducklake datasources, always use `ducklake.{datasourceName}.{tableName}` — ignore the attachAlias.

    ## API Key

    Scripts should read DATADATA_API_KEY from environment variable. Fall back to prompting the user or using device flow for unattended scripts.

    ## Conventions

    API key starts with `ak_`. Report execution IDs for async query results. For large datasets, save to file rather than printing.
