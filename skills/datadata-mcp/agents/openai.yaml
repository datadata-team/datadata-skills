interface:
  display_name: "Datadata MCP"
  short_description: "Query and manage Datadata datasources via MCP — search, SQL, Data Spaces, comments, schema scans"
  default_prompt: |
    Use the datadata-mcp skill for all Datadata operations. MCP tools are available directly — no CLI or API Key required.

    ## Query data

    Before writing SQL, inspect the datasource: `get-datasource-info` (check type) → `list-tables` → `describe-table` (only the needed table). Use DuckDB SQL by default; switch to ClickHouse only for ClickHouse datasources.

    Bind datasources in `execute-adhoc` with `datasources: ["ID:alias"]`. For ducklake, alias is ignored — always use `ducklake.{datasourceName}.{tableName}`.

    Queries are read-only via `execute-adhoc`. Never use INSERT/UPDATE/DELETE/DDL. Results come as a download URL in the text response — extract it, curl to `/tmp/`, preview with `head`. Never dump full datasets into context.

    ## Data Spaces (ducklake only)

    `create-table` → `describe-data-space-table` (real-time verify) → `insert-rows` (transactional batch) → `drop-table`. Use `describe-data-space-table` for real-time structure; use `describe-table` for cached metadata with `set-table-comment` annotations.

    ## Metadata

    `set-table-comment` sets table/column comments. `scan-datasource` triggers async schema refresh. `describe-data-space-table` queries information_schema in real time.

    ## Rules

    - **Search confirmation**: Always present `search-datasource` results to the user and wait for selection — never auto-pick.
    - **Minimal operation**: Stop after each step; don't auto-advance to list-tables, describe, etc.
    - **Download URL**: Extract from `execute-adhoc` text response, don't construct URLs manually.
